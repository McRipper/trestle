name: Plugin compatibility

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4']
    env:
      PG_BINDIR: /usr/lib/postgresql/16/bin
      RUN_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: trestle
      - uses: actions/checkout@v4
        with:
          repository: McRipper/trestle-auth
          ref: master
          path: trestle-auth
      - uses: actions/checkout@v4
        with:
          repository: McRipper/trestle-auth-otp
          ref: master
          path: trestle-auth-otp
      - uses: actions/checkout@v4
        with:
          repository: McRipper/trestle-search
          ref: main
          path: trestle-search
      - uses: actions/checkout@v4
        with:
          repository: McRipper/trestle-active_storage
          ref: master
          path: trestle-active_storage
      - uses: actions/checkout@v4
        with:
          repository: McRipper/trestle-good_job
          ref: main
          path: trestle-good_job
      - uses: actions/checkout@v4
        with:
          repository: McRipper/trestle-mobility
          ref: master
          path: trestle-mobility
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: '2.6.9'
      - name: Install PostgreSQL and image processing
        timeout-minutes: 7
        run: |
          # Use signed Ubuntu archives even when the runner's mirror DNS fails.
          apt_options=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/trestle-ubuntu.list" -o Dir::Etc::sourceparts=- -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o APT::Update::Error-Mode=any)
          updated=0
          for mirror in https://mirrors.edge.kernel.org/ubuntu https://archive.ubuntu.com/ubuntu; do
            cat > "$RUNNER_TEMP/trestle-ubuntu.list" <<APT
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] $mirror noble main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] $mirror noble-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] $mirror noble-security main universe
          APT
            if sudo timeout 90s apt-get "${apt_options[@]}" update; then
              updated=1
              break
            fi
          done
          [[ "$updated" == 1 ]]
          sudo timeout 180s env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y --no-install-recommends postgresql-16 libvips42t64
      - uses: browser-actions/setup-chrome@v1
      - uses: actions/cache@v4
        with:
          path: trestle/compatibility/.gems
          key: compatibility-${{ runner.os }}-ruby-${{ matrix.ruby }}-${{ hashFiles('trestle/compatibility/Gemfile.lock') }}
      - name: Install test dependencies
        run: trestle/compatibility/bin/run install
      - name: Verify all plugins, both pipelines, browser and OTP concurrency
        run: trestle/compatibility/bin/verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-ruby-${{ matrix.ruby }}
          path: |
            trestle/compatibility/logs/
            trestle/compatibility/revisions*.json
            trestle/compatibility/tmp/browser-failure.png
